name: PoC - Slack Review Notification Injection (self-trigger)

# 【适配声明】与 vercel/ai 原版的两处差异（均为触发面，非漏洞本体）：
#   1) 触发器 pull_request:[opened]（原为 review_requested——需组织团队评审，个人仓库无法满足）
#   2) Send Slack 步骤的 if: true（原为 ai-sdk 团队评审闸，同上原因）
# 【漏洞行】Send Slack notification 步骤的 curl 行与原版一字未改。

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  notify-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        if: true   # ADAPTED: 原为 steps.check_team.outputs.ai_sdk_requested == 'true'
        run: |
          curl ${{ env.SLACK_PR_REVIEW_REQUEST_URL }} -X POST -H "Content-Type: application/json" -d '{"channel_id": "${{ env.CHANNEL_ID }}", "number": "${{ env.NUMBER }}", "title": ${{ toJson(env.TITLE) }}, "url": "${{ env.URL }}"}'
        env:
          SLACK_PR_REVIEW_REQUEST_URL: ${{ secrets.SLACK_PR_REVIEW_REQUEST_URL }}
          CHANNEL_ID: 'C050WU03V3N'
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          URL: ${{ github.event.pull_request.html_url }}
